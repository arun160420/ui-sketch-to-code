<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Sketch-to-Code Converter | Interactive Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden">
  <!-- Top Navigation Header -->
  <header class="bg-slate-950 border-b border-slate-800 px-6 py-3.5 flex items-center justify-between shrink-0 z-50">
    <div class="flex items-center gap-4">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-600 flex items-center justify-center text-white font-extrabold text-lg shadow-md shadow-indigo-500/20">
        ⚡
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold text-white tracking-tight">UI Sketch-to-Code Converter</h1>
          <span class="px-2 py-0.5 text-xs font-semibold rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-mono">COM71123</span>
          <span class="px-2 py-0.5 text-xs font-semibold rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">ONLINE</span>
        </div>
        <p class="text-xs text-slate-400">Agentic Multimodal Code Generation, AST Validation & Self-Correction</p>
      </div>
    </div>

    <!-- View Switcher Tabs -->
    <nav class="flex items-center gap-1 bg-slate-900 p-1 rounded-xl border border-slate-800">
      <button onclick="switchView('output/week5/index.html', this)" class="nav-tab active px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1.5">
        <span>🌐</span> Live Generated Site
      </button>
      <button onclick="switchView('output/week8/index.html', this)" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <span>🔄</span> Week 8 Self-Correction
      </button>
      <button onclick="switchView('output/week7/index.html', this)" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <span>🎯</span> Week 7 Error Routing
      </button>
      <button onclick="switchView('output/week6/index.html', this)" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <span>🌳</span> Week 6 AST Validator
      </button>
      <button onclick="switchView('output/week4/index.html', this)" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <span>🔀</span> Week 4 Routing
      </button>
      <button onclick="switchView('output/week3/index.html', this)" class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
        <span>📝</span> Week 3 Initial
      </button>
    </nav>

    <!-- External Controls -->
    <div class="flex items-center gap-3">
      <a id="external-link" href="output/week5/index.html" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition-colors">
        <span>Open in New Tab</span>
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
      </a>
    </div>
  </header>

  <!-- Main Viewport / Iframe -->
  <main class="flex-1 w-full bg-slate-900 relative">
    <iframe id="viewport" src="output/week5/index.html" class="w-full h-full border-none bg-white" title="Project Preview"></iframe>
  </main>

  <script>
    function switchView(url, tabElement) {
      document.getElementById('viewport').src = url;
      document.getElementById('external-link').href = url;

      document.querySelectorAll('.nav-tab').forEach(t => {
        t.className = "nav-tab px-3.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5";
      });

      tabElement.className = "nav-tab active px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all bg-indigo-600 text-white shadow-sm flex items-center gap-1.5";
    }
  </script>
</body>
</html>
